<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/seedit.css">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <main>
        <header>
            <h1>See & Edit your task!</h1>
        </header>

        <section id="view-section">

            <div id="priority">
                <select id="priority-select">
                    <option value="VERY-HIGH">Very High</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="LOW">Low</option>
                    <option value="VERY-LOW">Very Low</option>
                </select>
            </div>

            <button id="save-button" class="buttons">Save</button>

            <button id="cancel-button" class="buttons">Cancel</button>
        </section>

    </main>
    <script type="module" src="/js/seedit.js"></script>
</body>
</html>
